
services:
  # -----------------------------------------------
  # PostgreSQL - Primary relational database
  # -----------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roomsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomsync
      POSTGRES_USER: roomsync
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomsync -d roomsync"]
      interval: 5s
      timeout: 3s
      retries: 20

  # -----------------------------------------------
  # Redis - Cache and distributed state
  # -----------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: roomsync-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # -----------------------------------------------
  # Apache Kafka - Event-driven architecture
  # KRaft mode: No Zookeeper required
  # -----------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: roomsync-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Separate internal and external listeners
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      # Controller configuration
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listener security
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker development configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Persistent Kafka data
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafkadata:/tmp/kraft-combined-logs

  # -----------------------------------------------
  # Prometheus - Metrics collection
  # -----------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: roomsync-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # -----------------------------------------------
  # Grafana - Monitoring dashboards
  # -----------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: roomsync-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

# -----------------------------------------------
# Persistent Docker volumes
# -----------------------------------------------
volumes:
  pgdata:
  redisdata:
  kafkadata:
